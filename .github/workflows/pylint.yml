name: Pylint

on:
    push:
        paths:
            - "**/*.py"
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements-lint.txt -r requirements.txt

            - name: Analysing the code with pylint
              shell: bash
              env:
                  PYTHONPATH: ${{ github.workspace }}
              run: |
                  set -euo pipefail

                  if [ "${GITHUB_EVENT_NAME}" = "push" ] && \
                    [ -n "${GITHUB_EVENT_BEFORE:-}" ] && \
                    [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
                    mapfile -t files < <(git diff --name-only --diff-filter=ACMRTUXB "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- '*.py')
                  else
                    default_branch="${{ github.event.repository.default_branch }}"
                    git fetch origin \
                      "${default_branch}:refs/remotes/origin/${default_branch}"
                    base_commit="$(git merge-base "origin/${default_branch}" HEAD)"
                    mapfile -t files < <(git diff --name-only --diff-filter=ACMRTUXB "${base_commit}" HEAD -- '*.py')
                  fi

                  if [ "${#files[@]}" -eq 0 ]; then
                    echo "No changed Python files to lint."
                    exit 0
                  fi

                  python -m pylint --rcfile=pylintrc --errors-only --disable=E1120 "${files[@]}"
